[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gihkcc"
version = "0.1.0"
description = "Experimental hierarchical compression methods for transformer KV caches and residual streams"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary; free for non-commercial research" }
authors = [{ name = "VecP Labs LLC" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
hf = [
    "accelerate>=0.30",
    "transformers>=4.44",
]
dev = [
    "pytest>=8",
    "transformers>=4.44",
]
eval = [
    "datasets>=3",
]
cuda = [
    "triton-windows==3.7.1.post27; platform_system == 'Windows'",
]

[project.scripts]
gihkcc-benchmark = "benchmark_compression:main"
gihkcc-downstream = "benchmark_downstream:main"
gihkcc-runtime = "benchmark_runtime:main"
gihkcc-blockwise = "benchmark_blockwise:main"
gihkcc-blockwise-generation = "validate_blockwise_generation:main"
gihkcc-quantized-kv-generation = "validate_quantized_kv_generation:main"

[tool.setuptools]
py-modules = ["aggregate_quantized_kv_results", "analyze_mlp_geometry_field", "benchmark_blockwise", "benchmark_compression", "benchmark_downproj_geometry", "benchmark_downstream", "benchmark_dynamic_mlp_compression", "benchmark_dynamic_residual_width", "benchmark_message_repacking", "benchmark_projection_aware_folding", "benchmark_real_residual", "benchmark_residual_folding", "benchmark_residual_repacking", "benchmark_runtime", "blockwise_attention", "blockwise_generation", "detect_residual_phases", "quantized_kv_generation", "residual_folding", "residual_repacking", "scan_downproj_geometry", "triton_kernels", "sweep_layer_bits", "validate_autoregressive", "validate_blockwise_generation", "validate_downproj_geometry", "validate_quantized_kv_generation", "gihkcc", "gihkcc_v2", "gihkcc_hf", "kvtc", "pca_layer", "ternary", "turboquant", "turboquant_paper"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["test_blockwise_attention.py", "test_dynamic_mlp_compression.py", "test_dynamic_residual_width.py", "test_gihkcc.py", "test_gihkcc_v2.py", "test_kvtc.py", "test_mlp_geometry_field.py", "test_residual_folding.py", "test_residual_repacking.py", "test_turboquant_paper.py"]
